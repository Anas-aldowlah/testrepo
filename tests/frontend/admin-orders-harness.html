<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Orders architecture harness</title>
</head>
<body>
    <link rel="stylesheet" href="../../wwwroot/lib/bootstrap/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="../../wwwroot/css/yaqut-theme.css">
    <link rel="stylesheet" href="../../wwwroot/css/admin/layout.css">
    <link rel="stylesheet" href="../../wwwroot/css/admin/orders.css">
    <main class="yq-orders-admin" data-yq-orders-page data-yq-update-status-url="/Admin/Orders/UpdateStatus">
        <div id="yqOrdersAlertArea"></div>
        <button id="locationTrigger"
                data-bs-toggle="popover"
                data-yq-popover-type="location"
                data-yq-customer-name="&lt;img src=x onerror=alert(1)&gt;"
                data-yq-recipient-name="&lt;svg onload=alert(2)&gt;"
                data-yq-recipient-phone="&quot;' 123"
                data-yq-governorate="صنعاء &amp; عدن"
                data-yq-region="Long value: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
                data-yq-details-url="/Admin/Orders/Details/42">Location</button>
        <button id="paymentTrigger"
                data-bs-toggle="popover"
                data-yq-popover-type="payment"
                data-yq-payment-method="&lt;img src=x onerror=alert(1)&gt;"
                data-yq-status-label="Pending"
                data-yq-details-url="/Admin/Orders/Details/42">Payment</button>
        <button id="receiptTrigger"
                data-bs-toggle="popover"
                data-yq-popover-type="receipt"
                data-yq-order-id="42"
                data-yq-receipt-image="/Admin/Orders/Receipt/42">Receipt</button>
        <button id="emptyReceiptTrigger"
                data-bs-toggle="popover"
                data-yq-popover-type="receipt"
                data-yq-order-id="43"
                data-yq-receipt-image="">Empty receipt</button>
        <form class="yq-ajax-status-form" data-order-id="42">
            <input name="__RequestVerificationToken" value="test-token">
            <select id="statusSelect" data-original-status="Pending">
                <option value="Pending">Pending</option>
                <option value="Delivered">Delivered</option>
                <option value="Shipped">Shipped</option>
            </select>
        </form>
        <span data-order-badge="42" class="yq-orders-badge yq-orders-badge--pending">Pending</span>
    </main>
    <div class="modal" id="receiptModal">
        <span id="modalOrderId"></span>
        <img id="modalReceiptImg" alt="">
        <a id="modalReceiptDownload"></a>
    </div>
    <output id="harnessResult">RUNNING</output>

    <script src="admin-orders-harness-bootstrap.js"></script>
    <script src="../../wwwroot/js/admin/orders/index.js"></script>
    <script src="admin-orders-harness-tests.js"></script>
</body>
</html>
