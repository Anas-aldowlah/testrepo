<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        html, body { overflow-x: hidden; }
        .yq-shop-layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; }
        .yq-reveal { opacity: 0; }
        .yq-reveal.is-visible { opacity: 1; }
        @media (max-width: 991.98px) { .yq-shop-layout { grid-template-columns: 1fr; } }
    </style>
    <title>Products catalog harness</title>
</head>
<body>
    <div class="yq-shop" data-yq-search-term="">
        <div id="yqRecentSearches" hidden><div id="yqRecentSearchesList"></div></div>
        <header class="yq-shop-header yq-reveal is-visible">Initial Header</header>
        <nav class="yq-shop-pills yq-reveal is-visible"><button type="button" data-yq-category="7">Category</button></nav>
        <div class="yq-shop-toolbar yq-reveal is-visible">Initial Toolbar<button type="button" id="yaqutFilterToggle">Filters</button></div>
        <div class="yq-shop-layout">
            <aside id="yaqutFilters">
                <form id="yqCatalogFilters" method="get">
                    <input id="yqCategoryId" name="categoryId" value="" />
                    <input type="radio" name="retail" value="all" checked data-yq-auto-submit />
                    <input type="radio" name="retail" value="yes" data-yq-auto-submit />
                    <input type="radio" name="retail" value="no" data-yq-auto-submit />
                </form>
            </aside>
            <div class="yq-shop-main">
                <div id="yaqutProductsGrid"><div data-product-id="1">Initial Product</div></div>
                <button type="button" id="yqLoadMoreBtn" data-current-page="1"><span data-yq-remaining>1</span></button>
                <p id="yqCatalogStatus"></p>
            </div>
        </div>
    </div>
    <div id="harnessResult">RUNNING</div>
    <script>
        window.catalogHarness = { requests: [], history: [], errors: [], scenario: 'retail-all' };
        window.addEventListener('error', function (event) { window.catalogHarness.errors.push(event.message); });
        var originalPushState = window.history.pushState;
        window.history.pushState = function (state, title, url) {
            window.catalogHarness.history.push(String(url));
            originalPushState.apply(this, arguments);
        };

        function catalogHtml(label, productId) {
            return [
                '<div class="yq-shop">',
                '<header class="yq-shop-header yq-reveal">' + label + ' Header</header>',
                '<nav class="yq-shop-pills yq-reveal"><button type="button" data-yq-category="7">' + label + ' Pills</button></nav>',
                '<div class="yq-shop-toolbar yq-reveal">' + label + ' Toolbar<button type="button" id="yaqutFilterToggle">Filters</button></div>',
                '<div class="yq-shop-layout"><aside id="yaqutFilters"><form id="yqCatalogFilters"></form></aside>',
                '<div class="yq-shop-main"><div id="yaqutProductsGrid"><div data-product-id="' + productId + '">' + label + ' Product</div></div>',
                '<button type="button" id="yqLoadMoreBtn" data-current-page="1"><span data-yq-remaining>1</span></button>',
                '<p id="yqCatalogStatus"></p></div></div></div>'
            ].join('\n');
        }
        function loadMoreHtml() {
            return '<div class="yq-shop"><div class="yq-shop-layout"><div class="yq-shop-main">' +
                '<div id="yaqutProductsGrid"><div data-product-id="999">Next Product</div></div>' +
                '<button type="button" id="yqLoadMoreBtn" data-current-page="2" hidden><span data-yq-remaining>0</span></button>' +
                '</div></div></div>';
        }
        window.fetch = async function (url) {
            window.catalogHarness.requests.push(String(url));
            var html = String(url).indexOf('page=') !== -1 ? loadMoreHtml()
                : window.catalogHarness.scenario === 'retail-no' ? catalogHtml('Retail No', 500)
                : window.catalogHarness.scenario === 'category' ? catalogHtml('Category', 700)
                : catalogHtml('Retail All', 600);
            return { ok: true, text: async function () { return html; } };
        };
    </script>
    <script src="../../wwwroot/js/products/index.js"></script>
    <script>
        (async function () {
            function assert(condition, message) { if (!condition) throw new Error(message); }
            function wait() { return new Promise(function (resolve) { setTimeout(resolve, 30); }); }
            function assertVisible(label) {
                ['.yq-shop-header', '.yq-shop-pills', '.yq-shop-toolbar'].forEach(function (selector) {
                    var node = document.querySelector(selector);
                    assert(node, label + ': missing ' + selector);
                    assert(node.classList.contains('is-visible'), label + ': reveal state missing for ' + selector);
                    assert(getComputedStyle(node).opacity === '1', label + ': transparent ' + selector);
                    assert(document.querySelectorAll(selector).length === 1, label + ': duplicate ' + selector);
                });
                assert(document.querySelectorAll('.yq-shop-main').length === 1, label + ': duplicate main region');
            }
            async function selectRetail(value, scenario) {
                window.catalogHarness.scenario = scenario;
                var radio = document.querySelector('input[name="retail"][value="' + value + '"]');
                assert(radio, 'Missing retail=' + value + ' control.');
                radio.click();
                await wait();
                assert(new URL(window.catalogHarness.requests.at(-1)).searchParams.get('retail') === value,
                    'Incorrect retail query value for ' + value + '.');
            }
            try {
                var liveToggle = document.getElementById('yaqutFilterToggle');
                var toggleClicks = 0;
                liveToggle.addEventListener('click', function () { toggleClicks += 1; });

                // Actual MVC returned all three regions without client-only is-visible.
                for (var cycle = 1; cycle <= 3; cycle++) {
                    await selectRetail('no', 'retail-no');
                    assertVisible('Cycle ' + cycle + ' retail=no');
                    assert(document.querySelector('.yq-shop-header').textContent === 'Retail No Header', 'retail=no SSR content was not synchronized.');
                    await selectRetail('all', 'retail-all');
                    assertVisible('Cycle ' + cycle + ' retail=all');
                    assert(document.querySelector('.yq-shop-header').textContent === 'Retail All Header', 'retail=all SSR content was not synchronized.');
                    assert(document.getElementById('yaqutFilterToggle') === liveToggle, 'The initialized mobile filter toggle was discarded.');
                }
                liveToggle.click();
                assert(toggleClicks === 1, 'The preserved mobile filter toggle lost its listener.');

                window.catalogHarness.scenario = 'category';
                document.querySelector('[data-yq-category]').click();
                await wait();
                assert(new URL(window.catalogHarness.requests.at(-1)).searchParams.get('categoryId') === '7', 'Category state was not serialized.');
                assertVisible('Category filter');

                var loadMore = document.getElementById('yqLoadMoreBtn');
                assert(loadMore, 'Load More is missing.');
                loadMore.click();
                await wait();
                assert(new URL(window.catalogHarness.requests.at(-1)).searchParams.get('page') === '2', 'Load More requested the wrong page.');
                assert(document.querySelector('[data-product-id="999"]'), 'Load More did not append the next product.');

                var selectors = ['.yq-shop-header', '.yq-shop-pills', '.yq-shop-toolbar', '.yq-shop-main'];
                var order = Array.from(document.querySelectorAll(selectors.join(','))).map(function (node) {
                    return selectors.find(function (selector) { return node.matches(selector); });
                });
                assert(order.join('|') === selectors.join('|'), 'Canonical region order changed: ' + order.join(', '));
                assert(window.catalogHarness.history.length === 7, 'Unexpected history update count.');
                assert(document.documentElement.dir === 'rtl', 'RTL direction changed.');
                assert(window.catalogHarness.errors.length === 0, 'Runtime errors: ' + window.catalogHarness.errors.join(', '));
                var result = document.getElementById('harnessResult');
                result.dataset.result = 'pass';
                result.textContent = 'PASS: real reveal-state regression, retail no/all x3, toggle listener preservation, filter state, Load More, ordering, no duplicates';
            } catch (error) {
                var failed = document.getElementById('harnessResult');
                failed.dataset.result = 'fail';
                failed.textContent = 'FAIL: ' + error.message;
            }
        })();
    </script>
</body>
</html>
