<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../wwwroot/lib/bootstrap/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="../../wwwroot/css/yaqut-theme.css" />
    <link rel="stylesheet" href="../../wwwroot/css/products/index.css" />
    <style>
        html, body { overflow-x: hidden; }
        .yq-reveal { opacity: 0; }
        .yq-reveal.is-visible { opacity: 1; }
    </style>
    <title>Products catalog harness</title>
</head>
<body>
    <div class="yq-shop" data-yq-search-term="">
        <div id="yqRecentSearches" hidden><div id="yqRecentSearchesList"></div></div>
        <header class="yq-shop-header yq-reveal is-visible">Original Header</header>
        <nav class="yq-shop-pills yq-reveal is-visible"><button type="button" data-yq-category="7">Category</button></nav>
        <div class="yq-shop-toolbar yq-reveal is-visible">Original Toolbar<button type="button" id="yaqutFilterToggle" class="yq-shop-filter-toggle">Filters</button></div>
        <div class="yq-shop-layout">
            <aside id="yaqutFilters">
                <form id="yqCatalogFilters" method="get">
                    <input id="yqCategoryId" name="categoryId" value="" />
                    <input id="minPrice" name="minPrice" value="" />
                    <input id="maxPrice" name="maxPrice" value="" />
                    <input type="radio" name="retail" value="all" data-yq-auto-submit checked>
                    <input type="radio" name="retail" value="yes" data-yq-auto-submit>
                    <input type="radio" name="retail" value="no" data-yq-auto-submit>
                    <div id="yqRetailSizeGroup" style="display:none">
                        <input type="checkbox" name="retailSize" value="5" data-yq-auto-submit>
                    </div>
                    <input type="checkbox" name="brand" value="A" data-yq-auto-submit>
                    <input type="checkbox" name="brand" value="B" data-yq-auto-submit>
                    <input type="checkbox" name="brand" value="C" data-yq-auto-submit>
                    <button type="submit" id="yqApply">Apply</button>
                    <button type="button" id="yqMobileCancel">Cancel</button>
                </form>
                <button type="button" id="yqFiltersClose">Close</button>
            </aside>
            <div class="yq-shop-main">
                <div class="yq-applied-filters"></div>
                <div id="yaqutProductsGrid"><div data-product-id="1">Original Product</div></div>
                <button type="button" id="yqLoadMoreBtn" data-current-page="1"><span data-yq-remaining>1</span></button>
                <p id="yqCatalogStatus"></p>
            </div>
        </div>
    </div>
    <!-- backdrop for mobile -->
    <div class="modal-backdrop fade show" id="yqBackdrop" hidden></div>
    <div id="harnessResult">RUNNING</div>

    <script>
        window.catalogHarness = { requests: [], history: [], errors: [], delayNext: 0, failNext: false, abortNext: false };
        window.addEventListener('error', function (event) {
            window.catalogHarness.errors.push(event.message);
        });

        function catalogHtml(url, label, productId) {
            var searchParams = new URL(url, location.origin).searchParams;
            var retail = searchParams.get('retail') || 'all';
            var sizes = searchParams.getAll('retailSize');
            var brands = searchParams.getAll('brand');
            var categoryId = searchParams.get('categoryId') || '';
            var minP = searchParams.get('minPrice');
            var maxP = searchParams.get('maxPrice');

            function checked(group, val) { return group === val ? ' checked' : ''; }

            var chips = [];
            var activeCount = 0;
            if (retail !== 'all') { chips.push('<button type="button" class="yq-chip-remove" data-remove-name="retail" data-remove-val="all">Retail</button>'); activeCount++; }
            sizes.forEach(function (s) { chips.push('<button type="button" class="yq-chip-remove" data-remove-name="retailSize" data-remove-val="' + s + '">Size</button>'); activeCount++; });
            brands.forEach(function (b) { chips.push('<button type="button" class="yq-chip-remove" data-remove-name="brand" data-remove-val="' + b + '">Brand</button>'); activeCount++; });
            if (categoryId) { chips.push('<button type="button" class="yq-chip-remove" data-remove-name="categoryId" data-remove-val="' + categoryId + '">Category</button>'); activeCount++; }
            if (minP || maxP) { chips.push('<button type="button" class="yq-chip-remove" data-remove-name="price" data-remove-val="">Price</button>'); activeCount++; }
            var badge = activeCount > 0 ? '<span class="yq-shop-filter-badge">' + activeCount + '</span>' : '';

            var form = [
                '<form id="yqCatalogFilters" method="get">',
                '<input id="yqCategoryId" name="categoryId" value="' + categoryId + '" />',
                '<input id="minPrice" name="minPrice" value="' + (minP||"") + '" />',
                '<input id="maxPrice" name="maxPrice" value="' + (maxP||"") + '" />',
                '<input type="radio" name="retail" value="all" data-yq-auto-submit' + checked(retail, 'all') + '>',
                '<input type="radio" name="retail" value="yes" data-yq-auto-submit' + checked(retail, 'yes') + '>',
                '<input type="radio" name="retail" value="no" data-yq-auto-submit' + checked(retail, 'no') + '>',
                '<div id="yqRetailSizeGroup" style="display:' + (retail === 'no' ? 'none' : 'block') + '">',
                '<input type="checkbox" name="retailSize" value="5" data-yq-auto-submit' + (sizes.includes('5') ? ' checked' : '') + '>',
                '</div>',
                '<input type="checkbox" name="brand" value="A" data-yq-auto-submit' + (brands.includes('A')?' checked':'') + '>',
                '<input type="checkbox" name="brand" value="B" data-yq-auto-submit' + (brands.includes('B')?' checked':'') + '>',
                '<input type="checkbox" name="brand" value="C" data-yq-auto-submit' + (brands.includes('C')?' checked':'') + '>',
                '<button type="submit" id="yqApply">Apply</button>',
                '<button type="button" id="yqMobileCancel">Cancel</button>',
                '</form>',
                '<button type="button" id="yqFiltersClose">Close</button>'
            ].join('');

            return '<div class="yq-shop"><header class="yq-shop-header yq-reveal">' + label + ' Header</header>' +
                '<nav class="yq-shop-pills yq-reveal"><button type="button" data-yq-category="7">Category</button></nav>' +
                '<div class="yq-shop-toolbar yq-reveal">' + label + ' Toolbar<button type="button" id="yaqutFilterToggle" class="yq-shop-filter-toggle">Filters' + badge + '</button></div>' +
                '<div class="yq-shop-layout"><aside id="yaqutFilters">' + form + '</aside><div class="yq-shop-main">' +
                '<div class="yq-applied-filters">' + chips.join('') + '<a class="yq-shop-clear-link" href="' + location.pathname + '">Clear</a></div>' +
                '<div id="yaqutProductsGrid"><div data-product-id="' + productId + '">' + label + ' Product</div></div>' +
                '<button type="button" id="yqLoadMoreBtn" data-current-page="1"><span data-yq-remaining>1</span></button><p id="yqCatalogStatus"></p></div></div></div>';
        }

        function loadMoreHtml() {
            return '<div class="yq-shop"><div class="yq-shop-layout"><div class="yq-shop-main"><div id="yaqutProductsGrid"><div data-product-id="999">Next Product</div></div><button type="button" id="yqLoadMoreBtn" data-current-page="2" hidden><span data-yq-remaining>0</span></button></div></div></div>';
        }

        window.fetch = async function (url, init) {
            window.catalogHarness.requests.push(String(url));
            if (window.catalogHarness.abortNext) {
                window.catalogHarness.abortNext = false;
                var e = new Error('synthetic abort'); e.name = 'AbortError'; throw e;
            }
            if (window.catalogHarness.failNext) {
                window.catalogHarness.failNext = false;
                return { ok: false };
            }
            if (window.catalogHarness.delayNext) {
                await new Promise(r => setTimeout(r, window.catalogHarness.delayNext));
                window.catalogHarness.delayNext = 0;
            }
            if (init && init.signal && init.signal.aborted) {
                var e = new Error('abort'); e.name = 'AbortError'; throw e;
            }
            var html = String(url).includes('page=') ? loadMoreHtml() : catalogHtml(url, 'Updated', 500);
            return { ok: true, text: async function () { return html; } };
        };

        // Mock window.history to record changes
        var pushStateObj = window.history.pushState;
        var replaceStateObj = window.history.replaceState;
        window.history.pushState = function(state, title, url) {
            window.catalogHarness.history.push(url);
            pushStateObj.apply(window.history, arguments);
        };
        window.history.replaceState = function(state, title, url) {
            window.catalogHarness.history.push(url);
            replaceStateObj.apply(window.history, arguments);
        };

        // Mock Escape and Backdrop click logic
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                var close = document.getElementById('yqFiltersClose');
                if (close) close.click();
            }
        });
        document.addEventListener('click', function(e) {
            if (e.target.id === 'yqBackdrop') {
                var close = document.getElementById('yqFiltersClose');
                if (close) close.click();
            }
        });

    </script>
    <script src="../../wwwroot/js/yaqut-main.js"></script>
    <script src="../../wwwroot/js/products/index.js"></script>
    <script>
        (async function () {
            function assert(condition, message) { if (!condition) throw new Error(message); }
            function wait() { return new Promise(function (resolve) { setTimeout(resolve, 50); }); }
            function requestCount() { return window.catalogHarness.requests.length; }
            function select(selector) { var node = document.querySelector(selector); assert(node, 'Missing ' + selector); return node; }
            function getLastUrl() { var r = window.catalogHarness.requests; return r.length ? new URL(r[r.length - 1], location.origin) : null; }

            function assertVisible(label) {
                ['.yq-shop-header', '.yq-shop-pills', '.yq-shop-toolbar'].forEach(function (selector) {
                    var node = select(selector);
                    assert(node.classList.contains('is-visible'), label + ': reveal state missing for ' + selector);
                    assert(getComputedStyle(node).opacity === '1', label + ': transparent ' + selector);
                    assert(document.querySelectorAll(selector).length === 1, label + ': duplicate ' + selector);
                });
            }
            async function expectOneRequest(action, label) {
                var before = requestCount();
                action();
                await wait();
                assert(requestCount() === before + 1, label + ': expected exactly one request.');
            }

            try {
                await wait();
                var mobile = window.innerWidth < 992;
                var liveToggle = select('#yaqutFilterToggle');

                // STEP 5A: Retail=no -> all x 3 reveal regression and toggle preservation
                for (var i = 0; i < 3; i++) {
                    await expectOneRequest(function () {
                        if (mobile) {
                            select('#yaqutFilterToggle').click();
                            select('input[name="retail"][value="no"]').click();
                            select('#yqApply').click();
                        } else {
                            select('input[name="retail"][value="no"]').click();
                        }
                    }, 'Retail=no');
                    assertVisible('Retail=no cycle ' + i);
                    assert(select('#yaqutFilterToggle') === liveToggle, 'Toggle node not preserved (Retail no).');

                    await expectOneRequest(function () {
                        if (mobile) {
                            select('#yaqutFilterToggle').click();
                            select('input[name="retail"][value="all"]').click();
                            select('#yqApply').click();
                        } else {
                            select('input[name="retail"][value="all"]').click();
                        }
                    }, 'Retail=all');
                    assertVisible('Retail=all cycle ' + i);
                    assert(select('#yaqutFilterToggle') === liveToggle, 'Toggle node not preserved (Retail all).');
                }

                // MULTI-BRAND & MOBILE APPLY/CANCEL
                if (mobile) {
                    select('#yaqutFilterToggle').click();
                    var beforeDraft = requestCount();
                    select('input[name="brand"][value="A"]').click();
                    select('input[name="brand"][value="B"]').click();
                    select('input[name="brand"][value="C"]').click();
                    assert(requestCount() === beforeDraft, 'Mobile requested before Apply.');
                    await expectOneRequest(function () { select('#yqApply').click(); }, 'Mobile Apply');
                    assert(getLastUrl().searchParams.getAll('brand').join(',') === 'A,B,C', 'Mobile apply URL missing brands.');

                    // Mobile Cancel
                    select('#yaqutFilterToggle').click();
                    select('input[name="brand"][value="A"]').click(); // uncheck
                    select('input[name="brand"][value="B"]').click(); // uncheck
                    var beforeCancel = requestCount();
                    select('#yqMobileCancel').click();
                    await wait();
                    assert(requestCount() === beforeCancel, 'Mobile cancel triggered request.');
                    select('#yaqutFilterToggle').click();
                    assert(select('input[name="brand"][value="A"]').checked, 'A not restored on cancel.');

                    // Mobile Close
                    select('input[name="brand"][value="A"]').click(); // uncheck
                    select('#yqFiltersClose').click();
                    await wait();
                    select('#yaqutFilterToggle').click();
                    assert(select('input[name="brand"][value="A"]').checked, 'A not restored on Close.');

                    // Mobile Escape
                    select('input[name="brand"][value="A"]').click();
                    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));
                    await wait();
                    select('#yaqutFilterToggle').click();
                    assert(select('input[name="brand"][value="A"]').checked, 'A not restored on Escape.');

                    // Mobile Backdrop
                    select('input[name="brand"][value="A"]').click();
                    var backdrop = select('#yqBackdrop'); backdrop.hidden = false;
                    backdrop.click();
                    await wait();
                    select('#yaqutFilterToggle').click();
                    assert(select('input[name="brand"][value="A"]').checked, 'A not restored on Backdrop click.');
                    select('#yqMobileCancel').click(); // close it properly
                } else {
                    await expectOneRequest(function() { select('input[name="brand"][value="A"]').click(); }, 'Desktop A');

                    await expectOneRequest(function() { select('.yq-shop-clear-link').click(); }, 'Clear All');

                    await expectOneRequest(function() { select('input[name="brand"][value="A"]').click(); }, 'Desktop A');
                    assert(getLastUrl().searchParams.getAll('brand').join(',') === 'A', 'Desktop A failed');
                    await expectOneRequest(function() { select('input[name="brand"][value="B"]').click(); }, 'Desktop B');
                    assert(getLastUrl().searchParams.getAll('brand').join(',') === 'A,B', 'Desktop B failed');
                    await expectOneRequest(function() { select('input[name="brand"][value="A"]').click(); }, 'Desktop uncheck A');
                    assert(getLastUrl().searchParams.getAll('brand').join(',') === 'B', 'Desktop uncheck A failed');
                }

                // CHIPS PARTIAL REMOVAL
                if (!mobile) {
                    await expectOneRequest(function() { select('input[name="brand"][value="A"]').click(); }, 'Desktop add A');
                    await expectOneRequest(function() { select('[data-remove-name="brand"][data-remove-val="A"]').click(); }, 'Chip remove A');
                    assert(getLastUrl().searchParams.getAll('brand').join(',') === 'B', 'Chip removal A failed');
                }

                // CHIPS RETAIL & SIZE & PRICE & CATEGORY
                if (!mobile) {
                    await expectOneRequest(function() { select('input[name="retail"][value="yes"]').click(); }, 'Retail yes');
                    await expectOneRequest(function() { select('[data-remove-name="retail"]').click(); }, 'Chip remove retail');
                    assert(getLastUrl().searchParams.get('retail') !== 'yes', 'Retail chip remove failed');

                    await expectOneRequest(function() { select('input[name="retailSize"][value="5"]').click(); }, 'Retail size 5');
                    await expectOneRequest(function() { select('[data-remove-name="retailSize"]').click(); }, 'Chip remove retail size');
                    assert(!getLastUrl().searchParams.has('retailSize'), 'Retail size chip remove failed');

                    // Set price
                    select('input[name="minPrice"]').value = '10';
                    select('input[name="maxPrice"]').value = '100';
                    // trigger submit
                    await expectOneRequest(function() { select('input[name="brand"][value="A"]').click(); }, 'Price submit');
                    await expectOneRequest(function() { select('[data-remove-name="price"]').click(); }, 'Chip remove price');
                    assert(!getLastUrl().searchParams.has('minPrice'), 'Price chip remove failed');
                }

                // RETAIL DEPENDENCY
                if (!mobile) {
                    await expectOneRequest(function() { select('input[name="retail"][value="yes"]').click(); }, 'Retail yes');
                    await expectOneRequest(function() { select('input[name="retailSize"][value="5"]').click(); }, 'Retail size 5');
                    assert(select('input[name="retailSize"][value="5"]').checked, 'Size 5 not checked');
                    assert(select('#yqRetailSizeGroup').style.display !== 'none', 'Retail size group hidden');
                    await expectOneRequest(function() { select('input[name="retail"][value="no"]').click(); }, 'Retail no');
                    assert(!select('input[name="retailSize"][value="5"]').checked, 'Size 5 not unchecked when retail=no');
                    assert(select('#yqRetailSizeGroup').style.display === 'none', 'Retail size group not hidden');
                    await expectOneRequest(function() { select('input[name="retail"][value="all"]').click(); }, 'Retail all');
                    assert(!select('input[name="retailSize"][value="5"]').checked, 'Size 5 checked when retail=all');
                    assert(select('#yqRetailSizeGroup').style.display !== 'none', 'Retail size group hidden when retail=all');
                }

                // HISTORY / POPSTATE / CLEAR ALL
                if (!mobile) {
                    await expectOneRequest(function() { select('.yq-shop-clear-link').click(); }, 'Clear All State');
                    var stateClear = location.href;
                    await expectOneRequest(function() { select('input[name="brand"][value="A"]').click(); }, 'State A');
                    var stateA = location.href;
                    await expectOneRequest(function() { select('input[name="brand"][value="B"]').click(); }, 'State A+B');

                    await expectOneRequest(function() { history.back(); }, 'Back to A');
                    assert(location.href === stateA && select('input[name="brand"][value="A"]').checked && !select('input[name="brand"][value="B"]').checked, 'Back to A failed');

                    await expectOneRequest(function() { history.back(); }, 'Back to Clear');
                    assert(location.href === stateClear && !select('input[name="brand"][value="A"]').checked, 'Back to Clear failed');

                    await expectOneRequest(function() { history.forward(); }, 'Forward to A');
                    assert(location.href === stateA && select('input[name="brand"][value="A"]').checked, 'Forward to A failed');
                }

                // OPEN DRAFT POPSTATE
                if (mobile) {
                    await expectOneRequest(function() { select('.yq-shop-clear-link').click(); }, 'Clear All State');
                    await expectOneRequest(function() {
                        select('#yaqutFilterToggle').click();
                        select('input[name="brand"][value="A"]').click();
                        select('#yqApply').click();
                    }, 'State A');
                    var stateA = location.href;

                    select('#yaqutFilterToggle').click();
                    select('input[name="brand"][value="B"]').click(); // unsaved draft B

                    var beforeDraftBack = requestCount();
                    history.back();
                    await wait();
                    assert(requestCount() === beforeDraftBack, 'Draft back triggered a request');
                    assert(location.href === stateA, 'Back did not return to canonical state A');
                    assert(select('input[name="brand"][value="A"]').checked && !select('input[name="brand"][value="B"]').checked, 'Draft not discarded on Back');

                }

                // LOAD MORE
                await expectOneRequest(function() { select('#yqLoadMoreBtn').click(); }, 'Load More');
                assert(select('[data-product-id="999"]'), 'Load More did not append next product.');
                assert(document.querySelectorAll('#yqCatalogFilters').length === 1, 'Duplicate filters');
                assert(document.querySelectorAll('.yq-shop-main').length === 1, 'Duplicate main regions');

                // LOADING OWNERSHIP
                // 1. Success cleanup
                window.catalogHarness.delayNext = 50;
                if (mobile) {
                    select('#yaqutFilterToggle').click();
                    select('input[name="brand"][value="B"]').click();
                    select('#yqApply').click();
                } else {
                    select('input[name="brand"][value="B"]').click();
                }
                assert(document.querySelector('#yaqutProductsGrid').getAttribute('aria-busy') === 'true', 'Busy not set during success request');
                await wait(); await wait(); await wait();
                assert(!document.querySelector('#yaqutProductsGrid').hasAttribute('aria-busy'), 'Busy not cleared after success request');

                // 2. Failure cleanup
                window.catalogHarness.failNext = true;
                if (mobile) {
                    select('#yaqutFilterToggle').click();
                    select('input[name="brand"][value="C"]').click();
                    select('#yqApply').click();
                } else {
                    select('input[name="brand"][value="C"]').click();
                }
                assert(document.querySelector('#yaqutProductsGrid').getAttribute('aria-busy') === 'true', 'Busy not set during failure request');
                await wait(); await wait(); await wait();
                assert(!document.querySelector('#yaqutProductsGrid').hasAttribute('aria-busy'), 'Busy not cleared after failure request');

                // 3. Current Abort cleanup
                window.catalogHarness.abortNext = true;
                if (mobile) {
                    select('#yaqutFilterToggle').click();
                    select('input[name="brand"][value="B"]').click();
                    select('#yqApply').click();
                } else {
                    select('input[name="brand"][value="B"]').click();
                }
                assert(document.querySelector('#yaqutProductsGrid').getAttribute('aria-busy') === 'true', 'Busy not set during abort request');
                await wait(); await wait(); await wait();
                assert(!document.querySelector('#yaqutProductsGrid').hasAttribute('aria-busy'), 'Busy not cleared after abort request');

                // 4. RAPID A -> B -> C and stale abort ownership
                window.catalogHarness.delayNext = 300;
                if (mobile) select('#yaqutFilterToggle').click();
                select('input[name="brand"][value="A"]').click();
                if (mobile) select('#yqApply').click();
                assert(document.querySelector('#yaqutProductsGrid').getAttribute('aria-busy') === 'true', 'Busy not set on A');

                await wait();
                window.catalogHarness.delayNext = 300;
                if (mobile) select('#yaqutFilterToggle').click();
                select('input[name="brand"][value="B"]').click();
                if (mobile) select('#yqApply').click();

                await wait();
                window.catalogHarness.delayNext = 50;
                if (mobile) select('#yaqutFilterToggle').click();
                select('input[name="brand"][value="C"]').click();
                if (mobile) select('#yqApply').click();

                assert(document.querySelector('#yaqutProductsGrid').getAttribute('aria-busy') === 'true', 'Busy not true during C');
                await wait(); await wait(); await wait();
                // C finishes
                assert(!document.querySelector('#yaqutProductsGrid').hasAttribute('aria-busy'), 'Busy not cleared after C finished');

                await wait(); await wait(); await wait(); await wait(); await wait(); await wait();
                // A and B finish (if they were delayed, but they are aborted anyway)
                assert(!document.querySelector('#yaqutProductsGrid').hasAttribute('aria-busy'), 'Busy leaked after A and B finished');

                // BADGE
                var badgeNode = document.querySelector('.yq-shop-filter-badge');
                if (badgeNode) {
                    assert(parseInt(badgeNode.textContent) > 0, 'Badge is wrong');
                }

                var result = document.getElementById('harnessResult');
                result.dataset.result = 'pass';
                result.textContent = 'PASS';
            } catch (error) {
                var failed = document.getElementById('harnessResult');
                failed.dataset.result = 'fail';
                failed.textContent = 'FAIL: ' + error.message;
            }
        })();
    </script>
</body>
</html>
