<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../wwwroot/css/yaqut-theme.css">
    <link rel="stylesheet" href="../../wwwroot/css/admin/layout.css">
    <link rel="stylesheet" href="../../wwwroot/css/admin/products.css">
    <style>
        html { scrollbar-width: none; }
        html::-webkit-scrollbar { display: none; }
        body { margin: 0; padding: 12px; background: #111416; }
        .yq-product-editor { min-width: 0; }
    </style>
    <script>
        window.adminProductEditHarness = { errors: [] };
        window.addEventListener('error', (event) => window.adminProductEditHarness.errors.push(String(event.error || event.message)));
        window.addEventListener('unhandledrejection', (event) => window.adminProductEditHarness.errors.push(String(event.reason)));
    </script>
</head>
<body>
    <main class="yq-products-create yq-product-editor">
        <form action="/Admin/Products/Edit" class="yq-product-form" data-product-edit-form
              data-product-retail-form data-retail-prefix="Product.">
            <section class="yq-product-form__section">
                <div class="yq-product-form__grid">
                    <div class="yq-product-field">
                        <label class="yaqut-form-label" for="Product_Name">الاسم</label>
                        <input id="Product_Name" name="Product.Name" value="عطر ياقوت" required class="yaqut-form-input">
                    </div>
                    <div class="yq-product-field">
                        <label class="yaqut-form-label" for="Product_Categoryid">التصنيف</label>
                        <select id="Product_Categoryid" name="Product.Categoryid" required class="yaqut-form-input"><option value="1" selected>عطور</option></select>
                    </div>
                    <div class="yq-product-field">
                        <label class="yaqut-form-label" for="Product_Price">السعر</label>
                        <input id="Product_Price" name="Product.Price" type="number" min="0" max="1000000" value="100" required class="yaqut-form-input">
                    </div>
                    <div class="yq-product-field">
                        <label class="yaqut-form-label" for="Product_Stockquantity">الكمية</label>
                        <input id="Product_Stockquantity" name="Product.Stockquantity" type="number" min="0" max="1000000" value="10" required class="yaqut-form-input">
                    </div>
                    <div class="yq-product-field">
                        <label class="yaqut-form-label" for="Product_StockUnit">الوحدة</label>
                        <select id="Product_StockUnit" name="Product.StockUnit" required data-stock-unit class="yaqut-form-input"><option value="Piece">قطعة</option><option value="Ml" selected>مل</option></select>
                    </div>
                    <div class="yq-product-field" data-volume-field>
                        <label class="yaqut-form-label" for="Product_VolumeMl">الحجم</label>
                        <input id="Product_VolumeMl" name="Product.VolumeMl" type="number" min="1" max="1000000" value="1000" class="yaqut-form-input" data-base-volume>
                    </div>
                    <label class="yq-retail-toggle"><input id="Product_IsRetailEnabled" name="Product.IsRetailEnabled" type="checkbox" checked data-retail-toggle> تفعيل التجزئة</label>
                </div>
                <div class="yq-retail-prices" data-retail-prices>
                    <div class="yq-retail-prices__head">
                        <div class="yq-retail-prices__intro"><strong>أسعار التجزئة</strong><span>تحقق واجهة</span></div>
                        <button type="button" class="btn-yaqut-outline yq-retail-add-btn" data-add-retail-price>إضافة سعر تجزئة</button>
                    </div>
                    <span class="yq-product-validation field-validation-valid" data-retail-group-validation tabindex="-1"></span>
                    <div class="yq-retail-prices__grid" data-retail-price-list>
                        <div class="yq-retail-price-row">
                            <div class="yq-retail-controls">
                                <div class="yq-product-field">
                                    <label class="yaqut-form-label" for="Product_RetailPrices_0__SizeMl">الحجم</label>
                                    <input id="Product_RetailPrices_0__SizeMl" name="Product.RetailPrices[0].SizeMl" value="250" class="yaqut-form-input">
                                    <span data-valmsg-for="Product.RetailPrices[0].SizeMl"></span>
                                </div>
                                <div class="yq-product-field">
                                    <label class="yaqut-form-label" for="Product_RetailPrices_0__Price">السعر</label>
                                    <input id="Product_RetailPrices_0__Price" name="Product.RetailPrices[0].Price" value="3" class="yaqut-form-input">
                                    <span data-valmsg-for="Product.RetailPrices[0].Price"></span>
                                </div>
                                <div class="yq-retail-active-field"><span class="yaqut-form-label">الحالة</span><label class="yq-retail-active"><input type="checkbox" name="Product.RetailPrices[0].IsActive" value="true" checked> <span data-retail-active-label>نشط</span></label><input type="hidden" name="Product.RetailPrices[0].IsActive" value="false"></div>
                                <div class="yq-retail-action-field"><span class="yaqut-form-label">الإجراء</span><button type="button" class="yq-retail-remove" data-remove-retail-price>حذف</button></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <button type="submit" class="btn-yaqut-gold" data-edit-save data-retail-save disabled>حفظ التعديلات</button>
        </form>

        <form class="yq-product-form yq-stock-adjustment-form" data-stock-adjustment data-current-stock="12500" data-base-size="1000" data-is-ml="true">
            <section class="yq-product-form__section yq-stock-adjustment-card">
                <div class="yq-stock-adjustment-grid">
                    <div class="yq-product-field">
                        <label class="yaqut-form-label" for="StockAdjustment_Operation">العملية</label>
                        <select id="StockAdjustment_Operation" data-adjustment-operation class="yaqut-form-input"><option value="Add">إضافة</option><option value="Subtract">خصم</option></select>
                    </div>
                    <div class="yq-product-field">
                        <label class="yaqut-form-label" for="StockAdjustment_SizeOption">الحجم</label>
                        <select id="StockAdjustment_SizeOption" data-adjustment-size class="yaqut-form-input">
                            <option value="Base" data-size-ml="1000" selected>1000 مل — الأساسي</option>
                            <option value="Retail:11" data-size-ml="250">250 مل — تجزئة</option>
                            <option value="Custom">مخصص</option>
                        </select>
                    </div>
                    <div class="yq-product-field" data-custom-size-field hidden>
                        <label class="yaqut-form-label" for="StockAdjustment_CustomSizeMl">المخصص</label>
                        <input id="StockAdjustment_CustomSizeMl" name="StockAdjustment.CustomSizeMl" data-custom-size class="yaqut-form-input"
                               data-val="true" data-val-range="يجب أن يكون الحجم المخصص بين 1 و1,000,000 مل.">
                    </div>
                    <div class="yq-product-field">
                        <label class="yaqut-form-label" for="StockAdjustment_Quantity">الكمية</label>
                        <input id="StockAdjustment_Quantity" name="StockAdjustment.Quantity" value="1" data-adjustment-quantity class="yaqut-form-input"
                               data-val="true" data-val-required="أدخل الكمية." data-val-range="يجب أن تكون الكمية بين 1 و1,000,000.">
                    </div>
                </div>
                <div class="yq-stock-preview" data-stock-preview>
                    <div><span>الحساب</span><strong data-preview-calculation>—</strong></div>
                    <div><span>التغيير</span><strong data-preview-change>—</strong></div>
                    <div><span>الرصيد</span><strong data-preview-balance>—</strong></div>
                </div>
                <button type="button" class="btn-yaqut-gold yq-stock-adjustment-submit">تنفيذ</button>
            </section>
        </form>
        <output id="harnessResult"></output>
    </main>

    <script>
        window.adminProductEditHarness.state = new URLSearchParams(location.search).get('state') || 'edit-retail';
        if (window.adminProductEditHarness.state.endsWith('non-retail')) {
            document.querySelector('[data-stock-unit]').value = 'Piece';
            document.getElementById('Product_IsRetailEnabled').checked = false;
            const adjustment = document.querySelector('[data-stock-adjustment]');
            adjustment.dataset.currentStock = '12';
            adjustment.dataset.baseSize = '1';
            adjustment.dataset.isMl = 'false';
            document.querySelector('[data-adjustment-size]').closest('.yq-product-field').remove();
            document.querySelector('[data-custom-size-field]').remove();
        }
        if (window.adminProductEditHarness.state.startsWith('create-')) {
            const productForm = document.querySelector('[data-product-retail-form]');
            productForm.action = '/Admin/Products/Create';
            productForm.removeAttribute('data-product-edit-form');
            productForm.dataset.retailPrefix = '';
            productForm.querySelectorAll('[name]').forEach((input) => {
                input.name = input.name.replace(/^Product\./, '');
            });
            productForm.querySelectorAll('[id]').forEach((input) => {
                const oldId = input.id;
                input.id = input.id.replace(/^Product_/, '');
                productForm.querySelector(`label[for="${CSS.escape(oldId)}"]`)?.setAttribute('for', input.id);
            });
            productForm.querySelectorAll('[data-valmsg-for]').forEach((message) => {
                message.dataset.valmsgFor = message.dataset.valmsgFor.replace(/^Product\./, '');
            });
        }
    </script>
    <script src="../../wwwroot/js/admin/products/edit.js"></script>
    <script>
        const failures = window.adminProductEditHarness.errors;
        const isRetailState = window.adminProductEditHarness.state.endsWith('retail') && !window.adminProductEditHarness.state.endsWith('non-retail');
        const retailPrefix = window.adminProductEditHarness.state.startsWith('create-') ? '' : 'Product.';
        const assert = (condition, message) => { if (!condition) failures.push(message); };
        const operation = document.querySelector('[data-adjustment-operation]');
        const size = document.querySelector('[data-adjustment-size]');
        const quantity = document.querySelector('[data-adjustment-quantity]');
        const custom = document.querySelector('[data-custom-size]');
        const customField = document.querySelector('[data-custom-size-field]');
        const balance = document.querySelector('[data-preview-balance]');
        const change = document.querySelector('[data-preview-change]');
        const saveButton = document.querySelector('[data-edit-save]');
        const productPrice = document.querySelector('input[name$=".Price"]:not([name*="RetailPrices"])')
            || document.querySelector('input[name="Price"]');

        if (window.adminProductEditHarness.state.startsWith('create-')) {
            assert(!saveButton.disabled, 'Complete valid Product Create did not enable save.');
            const productName = document.querySelector('input[name="Name"]');
            productName.value = '';
            productName.dispatchEvent(new Event('input', { bubbles: true }));
            assert(saveButton.disabled, 'Incomplete Product Create did not disable save.');
            productName.value = 'عطر ياقوت';
            productName.dispatchEvent(new Event('input', { bubbles: true }));
            assert(!saveButton.disabled, 'Restoring valid Product Create fields did not enable save.');
        } else {
            assert(saveButton.disabled, 'Untouched Product Edit did not start disabled.');
            productPrice.value = '101';
            productPrice.dispatchEvent(new Event('input', { bubbles: true }));
            assert(!saveButton.disabled, 'A valid Product Edit change did not enable save.');
            productPrice.value = '100';
            productPrice.dispatchEvent(new Event('input', { bubbles: true }));
            assert(saveButton.disabled, 'Reverting Product Edit did not disable save again.');
        }

        assert(!isRetailState || size.value === 'Base', 'Base size was not selected by default.');
        assert(balance.textContent !== '—' && change.textContent !== '—', 'Base-size preview was not calculated.');
        const baseBalance = balance.textContent;

        if (isRetailState) {
            size.value = 'Retail:11';
            quantity.value = '2';
            size.dispatchEvent(new Event('change', { bubbles: true }));
            quantity.dispatchEvent(new Event('input', { bubbles: true }));
            assert(balance.textContent !== baseBalance, 'Retail-size preview did not update.');

            size.value = 'Custom';
            size.dispatchEvent(new Event('change', { bubbles: true }));
            custom.value = '500';
            custom.dispatchEvent(new Event('input', { bubbles: true }));
            assert(!customField.hidden && custom.required, 'Custom-size control was not revealed and required.');
        } else {
            assert(document.querySelector('[data-retail-prices]').hidden, 'Retail rows remained visible for non-retail state.');
            assert(document.querySelector('[data-volume-field]').hidden, 'Volume field remained visible for piece stock.');
            assert(document.querySelector('.yq-retail-toggle').hidden, 'Retail toggle remained visible for piece stock.');
        }

        operation.value = 'Subtract';
        operation.dispatchEvent(new Event('change', { bubbles: true }));
        assert(change.textContent.includes('−'), 'Subtract preview did not show a negative operation.');

        if (isRetailState) {
            document.querySelector('[data-add-retail-price]').click();
            assert(document.querySelectorAll('.yq-retail-price-row').length === 2, 'Dynamic retail row was not added.');
            assert(saveButton.disabled, 'A blank invalid retail row did not disable save.');
            const invalidSubmit = new Event('submit', { bubbles: true, cancelable: true });
            document.querySelector('[data-product-retail-form]').dispatchEvent(invalidSubmit);
            const visibleValidationMessages = [...document.querySelectorAll('.field-validation-error')]
                .map((element) => element.textContent.trim())
                .filter(Boolean);
            const configuredValidationMessages = [...document.querySelectorAll('[data-val-required], [data-val-range]')]
                .flatMap((element) => [element.dataset.valRequired, element.dataset.valRange])
                .filter(Boolean);
            assert(invalidSubmit.defaultPrevented, 'Invalid retail row did not prevent submission.');
            assert(visibleValidationMessages.length >= 2, 'Invalid retail row did not show field validation messages.');
            assert([...visibleValidationMessages, ...configuredValidationMessages].every((message) => !/[A-Za-z]/.test(message)), 'Client-visible validation exposed an English message.');

            const retailRows = [...document.querySelectorAll('.yq-retail-price-row')];
            retailRows[1].querySelector('input[name$=".SizeMl"]').value = '250';
            retailRows[1].querySelector('input[name$=".Price"]').value = '4';
            retailRows[1].querySelector('input[name$=".Price"]').dispatchEvent(new Event('input', { bubbles: true }));
            const duplicateSubmit = new Event('submit', { bubbles: true, cancelable: true });
            document.querySelector('[data-product-retail-form]').dispatchEvent(duplicateSubmit);
            const duplicateSizeErrors = retailRows.filter((row) =>
                row.querySelector('[data-valmsg-for$=".SizeMl"]')?.classList.contains('field-validation-error'));
            const groupError = document.querySelector('[data-retail-group-validation]');
            assert(duplicateSubmit.defaultPrevented, 'Duplicate retail sizes did not prevent submission.');
            assert(duplicateSizeErrors.length === 2, 'Duplicate retail sizes did not mark both affected Size fields.');
            assert(groupError?.textContent.trim(), 'Duplicate-only rows did not show the zero-valid-row group error.');
            assert(saveButton.disabled, 'Save was not disabled when retail was ON with zero valid rows.');

            document.querySelector('.yq-retail-price-row [data-remove-retail-price]').click();
            assert(!saveButton.disabled, 'Save was not re-enabled after one valid retail row remained.');
            const remainingSize = document.querySelector('.yq-retail-price-row input[name$=".SizeMl"]');
            const remainingActive = document.querySelector('.yq-retail-price-row input[type="checkbox"][name$=".IsActive"]');
            const remainingActiveFallback = document.querySelector('.yq-retail-price-row input[type="hidden"][name$=".IsActive"]');
            assert(remainingSize?.name === `${retailPrefix}RetailPrices[0].SizeMl`, 'Retail rows were not reindexed after removal.');
            assert(remainingActive?.name === `${retailPrefix}RetailPrices[0].IsActive`, 'Retail active checkbox was not reindexed after removal.');
            assert(remainingActiveFallback?.name === `${retailPrefix}RetailPrices[0].IsActive` && remainingActiveFallback.value === 'false', 'Retail active false fallback was not reindexed with its row.');
            const remainingRow = remainingActive.closest('.yq-retail-price-row');
            const activeRect = remainingRow.getBoundingClientRect();
            const activeStyle = getComputedStyle(remainingRow);
            const activePresentation = {
                background: activeStyle.backgroundColor,
                border: activeStyle.border,
                opacity: activeStyle.opacity,
                padding: activeStyle.padding,
                gap: activeStyle.gap
            };
            remainingActive.checked = false;
            remainingActive.dispatchEvent(new Event('change', { bubbles: true }));
            const inactiveRect = remainingRow.getBoundingClientRect();
            const inactiveStyle = getComputedStyle(remainingRow);
            assert(remainingRow.classList.contains('is-inactive'), 'Inactive retail row did not receive its state hook.');
            assert(remainingRow.querySelector('[data-retail-active-label]')?.textContent === 'نشط', 'Inactive retail row label changed away from the fixed status label.');
            assert(activeRect.width === inactiveRect.width && activeRect.height === inactiveRect.height,
                'Inactive retail row changed card dimensions.');
            assert(activePresentation.background === inactiveStyle.backgroundColor &&
                   activePresentation.border === inactiveStyle.border &&
                   activePresentation.opacity === inactiveStyle.opacity &&
                   activePresentation.padding === inactiveStyle.padding &&
                   activePresentation.gap === inactiveStyle.gap,
                'Inactive retail row changed card presentation or spacing.');
            remainingActive.checked = true;
            remainingActive.dispatchEvent(new Event('change', { bubbles: true }));

            remainingActive.closest('.yq-retail-price-row').querySelector('[data-remove-retail-price]').click();
            assert(saveButton.disabled, 'Deleting the last valid retail row did not disable save immediately.');
            assert(groupError?.textContent.trim(), 'Deleting the last valid retail row did not expose the group error.');

            document.querySelector('[data-add-retail-price]').click();
            const replacementRow = document.querySelector('.yq-retail-price-row');
            replacementRow.querySelector('input[name$=".SizeMl"]').value = '125';
            replacementRow.querySelector('input[name$=".Price"]').value = '5';
            replacementRow.querySelector('input[name$=".Price"]').dispatchEvent(new Event('input', { bubbles: true }));
            assert(!saveButton.disabled, 'Entering a valid retail row did not re-enable save.');
        }
        assert(!document.querySelector('[name*="NetStock"]'), 'A client-computed net stock field must not be posted.');
        assert(getComputedStyle(document.documentElement).direction === 'rtl', 'RTL direction was not preserved.');

        const result = document.getElementById('harnessResult');
        result.dataset.result = failures.length ? 'fail' : 'pass';
        result.textContent = failures.length ? failures.join(' | ') : `${window.adminProductEditHarness.state} Admin Product Edit interactions passed.`;
    </script>
</body>
</html>
