<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home carousel keyboard and ARIA harness</title>
    <link rel="stylesheet" href="../../wwwroot/lib/bootstrap/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="../../wwwroot/css/yaqut-theme.css">
    <link rel="stylesheet" href="../../wwwroot/css/home/index.css">
</head>
<body>
    <main class="yq-home-page">
        <section class="yq-home-hero" aria-label="الرئيسية">
            <div class="yq-home-hero__carousel-bg yq-home-carousel"
                 data-yq-hero-carousel
                 role="region"
                 aria-roledescription="عرض شرائح"
                 aria-label="أحدث عطور ياقوت">
                <div class="yq-home-carousel__viewport">
                    <article class="yq-home-carousel__slide is-active" data-yq-hero-slide aria-hidden="false">
                        <div class="yq-home-carousel__product">
                            <a href="/Products/Details/1" class="yq-home-carousel__product-link">صورة العطر الأول</a>
                            <div class="container yq-home-carousel__bottom-wrapper">
                                <div class="yq-home-carousel__bottom-bar">
                                    <a href="/Products/Details/1" class="yq-home-button yq-home-button--primary"
                                       tabindex="2" data-yq-harness-authored-tabindex="2">تسوّق الآن</a>
                                </div>
                            </div>
                        </div>
                    </article>
                    <article class="yq-home-carousel__slide" data-yq-hero-slide aria-hidden="true">
                        <div class="yq-home-carousel__product">
                            <a href="/Products/Details/2" class="yq-home-carousel__product-link">صورة العطر الثاني</a>
                            <div class="container yq-home-carousel__bottom-wrapper">
                                <div class="yq-home-carousel__bottom-bar">
                                    <a href="/Products/Details/2" class="yq-home-button yq-home-button--primary"
                                       tabindex="0" data-yq-harness-authored-tabindex="0">تسوّق الآن</a>
                                </div>
                            </div>
                        </div>
                    </article>
                    <article class="yq-home-carousel__slide" data-yq-hero-slide aria-hidden="true">
                        <div class="yq-home-carousel__product">
                            <a href="/Products/Details/3" class="yq-home-carousel__product-link">صورة العطر الثالث</a>
                            <div class="container yq-home-carousel__bottom-wrapper">
                                <div class="yq-home-carousel__bottom-bar">
                                    <a href="/Products/Details/3" class="yq-home-button yq-home-button--primary"
                                       tabindex="-1" data-yq-harness-authored-tabindex="-1">تسوّق الآن</a>
                                </div>
                            </div>
                        </div>
                    </article>
                </div>
                <button type="button" data-yq-hero-prev aria-label="العطر السابق">السابق</button>
                <button type="button" data-yq-hero-next aria-label="العطر التالي">التالي</button>
                <div class="yq-home-carousel__dots" aria-label="اختيار العطر">
                    <button type="button" data-yq-hero-dot="0" class="is-active" aria-current="true">1</button>
                    <button type="button" data-yq-hero-dot="1" aria-current="false">2</button>
                    <button type="button" data-yq-hero-dot="2" aria-current="false">3</button>
                </div>
            </div>
            <div data-yq-hero-carousel data-yq-hero-carousel-single aria-label="عطر واحد">
                <article class="yq-home-carousel__slide" data-yq-hero-slide aria-hidden="true">
                    <div class="yq-home-carousel__product">
                        <a href="/Products/Details/4" class="yq-home-carousel__product-link">صورة العطر المفرد</a>
                        <a href="/Products/Details/4" class="yq-home-button yq-home-button--primary">تسوّق الآن</a>
                    </div>
                </article>
            </div>
        </section>
    </main>
    <button type="button" id="outsideControl">خارج العرض</button>
    <output id="harnessResult">RUNNING</output>

    <script src="home-carousel-harness-bootstrap.js"></script>
    <script src="../../wwwroot/js/home/index.js"></script>
    <script src="home-carousel-harness-tests.js"></script>
</body>
</html>
