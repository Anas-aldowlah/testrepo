<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <title>Checkout draft privacy harness</title>
</head>
<body>
    <form id="yqCheckoutForm" action="/Orders/Checkout" method="post" data-yq-checkout-user="101" data-yq-auth-required="false">
        <input name="CheckoutDraftId" type="hidden" data-yq-checkout-draft-id />
        <input name="Governorate" />
        <input name="City" />
        <input name="District" />
        <input name="Street" type="tel" />
        <textarea name="DeliveryNotes"></textarea>
        <input name="PaymentMethod" type="radio" value="server-payment" checked />
        <input name="SubmittedCartTotal" type="hidden" value="999" />
    </form>
    <section data-yq-checkout-draft-recovery hidden aria-labelledby="recoveryTitle">
        <h2 id="recoveryTitle">استعادة المسودة</h2>
        <button type="button" data-yq-checkout-draft-restore>استعادة</button>
        <button type="button" data-yq-checkout-draft-fresh>البدء من جديد</button>
    </section>
    <form id="logoutForm" action="/Account/Logout" method="post"></form>
    <main data-yq-confirmation-page data-yq-clear-checkout-draft-id=""></main>
    <output id="harnessResult"></output>

    <script>
        (function () {
            const scenario = new URLSearchParams(location.search).get('scenario') || 'valid';
            const draftId1 = '11111111-1111-4111-8111-111111111111';
            const draftId2 = '22222222-2222-4222-8222-222222222222';
            const fields = {
                Governorate: 'حضرموت',
                City: 'المكلا',
                District: 'المستلم',
                Street: '771234567',
                DeliveryNotes: 'اتصل قبل الوصول'
            };
            const record = { DraftId: draftId1, ...fields };

            window.mockServerDraft = null;
            window.mockFetchRequests = [];

            // Mock fetch to capture saves and clears
            const originalFetch = window.fetch;
            window.fetch = function(url, options) {
                if (typeof url === 'string') {
                    if (url.includes('SaveCheckoutDraft')) {
                        const payload = JSON.parse(options.body);
                        window.mockServerDraft = payload;
                        window.mockFetchRequests.push({ type: 'save', payload });
                        return Promise.resolve({ ok: true });
                    }
                    if (url.includes('ClearCheckoutDraft')) {
                        window.mockServerDraft = null;
                        window.mockFetchRequests.push({ type: 'clear' });
                        return Promise.resolve({ ok: true });
                    }
                }
                return originalFetch.apply(this, arguments);
            };

            localStorage.clear();

            // Legacy test: populate old localStorage
            if (scenario === 'legacy' || scenario === 'legacy-cleanup') {
                localStorage.setItem('yq-checkout-draft', JSON.stringify(fields));
            }

            // For new scenarios, we inject the server JSON script block
            if (scenario !== 'save' && scenario !== 'storage-disabled' && scenario !== 'malformed' && scenario !== 'legacy' && scenario !== 'legacy-cleanup' && scenario !== 'expired' && scenario !== 'mismatch') {
                const script = document.createElement('script');
                script.id = 'yq-server-checkout-draft';
                script.type = 'application/json';
                script.textContent = JSON.stringify(record);
                document.body.appendChild(script);
                window.mockServerDraft = record;
            } else if (scenario === 'malformed') {
                const script = document.createElement('script');
                script.id = 'yq-server-checkout-draft';
                script.type = 'application/json';
                script.textContent = '{bad-json';
                document.body.appendChild(script);
            }

            if (scenario === 'server') document.querySelector('[name="Governorate"]').value = 'عدن';
            if (scenario === 'storage-disabled') {
                // Not applicable to server draft, but we can simulate fetch throwing
                window.fetch = function() { return Promise.reject(new Error('network disabled')); };
            }

            window.checkoutHarness = { scenario, fields, record, draftId1, draftId2 };
        })();
    </script>
    <script src="../../wwwroot/js/checkout-draft-storage.js"></script>
    <script src="../../wwwroot/js/orders/checkout.js"></script>
    <script src="checkout-draft-harness-tests.js"></script>
</body>
</html>
