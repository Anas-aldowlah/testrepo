<!doctype html>
<html lang="ar" dir="rtl" class="theme-light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin feedback harness</title>
    <link rel="stylesheet" href="../../wwwroot/css/yaqut-theme.css" />
    <link rel="stylesheet" href="../../wwwroot/css/admin/layout.css" />
    <link rel="stylesheet" href="../../wwwroot/css/admin/users.css" />
</head>
<body class="yaqut-admin-body">
    <main class="yq-admin-shell" style="display:block; padding:1rem;">
        <section class="yq-user-details-admin">
            <div class="yaqut-alert yq-admin-operation-feedback yaqut-alert--success" role="status" data-test-alert>
                <i aria-hidden="true">✓</i>
                <span>تم تحديث دور المستخدم بنجاح.</span>
            </div>

            <form class="yq-role-change-form" data-role-change-form>
                <label for="newRoleSelect">اختر الدور الجديد:</label>
                <select id="newRoleSelect" class="yq-role-select" data-role-select>
                    <option value="Customer">زبون</option>
                    <option value="Admin">مدير</option>
                    <option value="Developer">مطور</option>
                </select>
                <button type="submit" class="yq-role-btn-submit" data-role-submit disabled>
                    تحديث الدور
                </button>
            </form>
        </section>
    </main>

    <script>
        const currentRole = new URLSearchParams(location.search).get('current') || 'Customer';
        const roleForm = document.querySelector('[data-role-change-form]');
        const roleSelect = roleForm.querySelector('[data-role-select]');
        roleForm.dataset.currentRole = currentRole;
        roleSelect.value = currentRole;
        window.adminFeedbackHarness = { submitCount: 0, currentRole };
        roleForm.addEventListener('submit', function (event) {
            event.preventDefault();
            window.adminFeedbackHarness.submitCount += 1;
        });
    </script>
    <script src="../../wwwroot/js/admin/users/details.js"></script>
</body>
</html>
